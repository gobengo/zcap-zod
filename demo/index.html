<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zcap-zod smoke test</title>
  <link rel="icon" href="data:,">
  <!--
    No import map on purpose: each test runs its snippet exactly as shown,
    importing zcap-zod by absolute URL, the same way a page elsewhere would.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --ok: #1a7f37; --bad: #cf222e; --muted: #6e7781;
      --code-bg: #f6f8fa; --border: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ok: #3fb950; --bad: #f85149; --muted: #8b949e; --code-bg: #161b22; --border: #30363d; }
    }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 16px; }
    #badge { font-size: 5rem; line-height: 1; }
    #summary { font-size: 1.25rem; font-weight: 600; }
    [data-status="pass"] #summary { color: var(--ok); }
    [data-status="fail"] #summary { color: var(--bad); }
    section { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1.5rem; }
    h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
    .snippet { position: relative; }
    pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
          padding: .75rem; overflow-x: auto; font-size: .8rem; margin: .5rem 0; }
    pre.output { max-height: 16rem; overflow: auto; }
    .copy { position: absolute; top: .4rem; right: .4rem; font: inherit; font-size: .75rem;
            padding: .15rem .5rem; cursor: pointer; }
    .description { margin: 0 0 .5rem; }
    .label { color: var(--muted); font-size: .8rem; margin: .75rem 0 0; }
    .meta { color: var(--muted); font-size: .875rem; margin-top: 2rem; }
  </style>
</head>
<body data-status="running">
  <div id="badge" aria-hidden="true">⏳</div>
  <p id="summary" role="status">Running…</p>
  <p class="meta">Each snippet below is the exact code that ran. Paste it into any HTML file to try it.
    See also: <a href="spec-examples.html">check a zcap-spec's examples against zcap-zod</a>.</p>
  <div id="tests"></div>
  <p class="meta" id="build">Build info unavailable.</p>

  <script type="module">
    // Absolute URL of the zcap-zod build served next to this page.
    const MODULE_URL = new URL("zcap-zod/index.js", document.baseURI).href

    // `code` is shown verbatim and executed verbatim. The harness only appends
    // `export { … }` for the names in `expose`, so it can inspect the outcome.
    const tests = [
      {
        name: "Import zcap-zod",
        code: `import * as zcapZod from "${MODULE_URL}"

console.log(Object.keys(zcapZod))`,
        expose: ["zcapZod"],
        check: ({ zcapZod }) => ({
          ok: typeof zcapZod.Zcap?.safeParse === "function",
          output: Object.keys(zcapZod),
        }),
      },
      {
        name: "Parse a valid root zcap",
        code: `import { Zcap } from "${MODULE_URL}"

const result = Zcap.safeParse({
  "@context": "https://w3id.org/zcap/v1",
  id: "urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo",
  invocationTarget: "https://example.com/foo",
  controller: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
})
console.log(result.success) // true`,
        expose: ["result"],
        check: ({ result }) => ({
          ok: result.success === true,
          output: result.success ? result.data : result.error.issues,
        }),
      },
      {
        name: "Reject a non-zcap",
        code: `import { Zcap } from "${MODULE_URL}"

const result = Zcap.safeParse({ hello: "world" })
console.log(result.success) // false
console.log(result.error.issues)`,
        expose: ["result"],
        check: ({ result }) => ({
          ok: result.success === false,
          output: result.success ? { unexpectedlyAccepted: result.data } : result.error.issues,
        }),
      },
      // Walkthrough: validate a root zcap, see why it fails, fix it.
      {
        name: "Walkthrough 1a: a root zcap missing @context is rejected, with the reason",
        description: "Validate a root zcap with RootZcap.safeParse. This one leaves out @context, so validation fails and each issue says which property is wrong and which rule of the zcap-spec it breaks.",
        code: `import { RootZcap } from "${MODULE_URL}"

const rootZcap = {
  id: "urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo",
  invocationTarget: "https://example.com/foo",
  controller: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
}

const result = RootZcap.safeParse(rootZcap)
console.log(result.success) // false

const why = result.error.issues.map((issue) => \`\${issue.path.join(".")}: \${issue.message}\`)
console.log(why)
// [ '@context: A root zcap MUST have an @context field that is a string with the value "https://w3id.org/zcap/v1".' ]`,
        expose: ["result", "why"],
        check: ({ result, why }) => ({
          ok: result.success === false && result.error.issues.some((issue) => issue.path[0] === "@context"),
          output: why ?? result,
        }),
      },
      {
        name: "Walkthrough 1b: adding @context makes the root zcap valid",
        description: "Add the missing @context and validate again. The same object now passes, and result.data is the typed root zcap.",
        code: `import { RootZcap } from "${MODULE_URL}"

const rootZcap = {
  "@context": "https://w3id.org/zcap/v1", // added
  id: "urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo",
  invocationTarget: "https://example.com/foo",
  controller: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
}

const result = RootZcap.safeParse(rootZcap)
console.log(result.success) // true
console.log(result.data)`,
        expose: ["result"],
        check: ({ result }) => ({
          ok: result.success === true,
          output: result.success ? result.data : result.error.issues,
        }),
      },
      // Walkthrough: a delegated zcap whose proof has the wrong purpose, then fixed.
      {
        name: "Walkthrough 2a: a delegated zcap with a capabilityInvocation proof is rejected, with the reason",
        description: "A delegated zcap has to carry a capabilityDelegation proof: the proof that its controller delegated it. A common mistake is to sign it with a capabilityInvocation proof instead. Everything else here is well-formed, so the one issue points at the proof and says which purpose is required.",
        code: `import { DelegatedZcap } from "${MODULE_URL}"

const delegatedZcap = {
  "@context": [
    "https://w3id.org/zcap/v1",
    "https://w3id.org/security/suites/ed25519-2020/v1",
  ],
  id: "urn:uuid:cdc77118-6bfa-11ec-aceb-10bf48838a41",
  parentCapability: "urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo",
  invocationTarget: "https://example.com/foo",
  controller: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
  expires: "2021-11-03T18:33:51Z",
  allowedAction: ["read"],
  proof: {
    type: "Ed25519Signature2020",
    created: "2021-10-27T18:33:51Z",
    verificationMethod: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9#z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
    proofPurpose: "capabilityInvocation", // wrong purpose for a delegation
    capabilityChain: ["urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo"],
    proofValue: "z3t9BCQyF21MDVYmLKc9zbLreqx4wBtQnUsd5aqyoWS5FfhapRz7QjPNLcgKAornUVmJR4ZjbGpuxRFnffxX1ZjtF",
  },
}

const result = DelegatedZcap.safeParse(delegatedZcap)
console.log(result.success) // false

const why = result.error.issues.map((issue) => \`\${issue.path.join(".")}: \${issue.message}\`)
console.log(why)
// [ 'proof: At least one proof MUST have a proofPurpose of "capabilityDelegation".' ]`,
        expose: ["result", "why"],
        check: ({ result, why }) => ({
          ok: result.success === false && result.error.issues.some((issue) => issue.path[0] === "proof"),
          output: why ?? result,
        }),
      },
      {
        name: "Walkthrough 2b: with a capabilityDelegation proof, the delegated zcap is valid",
        description: "Change proofPurpose to capabilityDelegation and validate again. The delegated zcap now passes. (zcap-zod checks the data model only; verifying the signature is a job for a Data Integrity library.)",
        code: `import { DelegatedZcap } from "${MODULE_URL}"

const delegatedZcap = {
  "@context": [
    "https://w3id.org/zcap/v1",
    "https://w3id.org/security/suites/ed25519-2020/v1",
  ],
  id: "urn:uuid:cdc77118-6bfa-11ec-aceb-10bf48838a41",
  parentCapability: "urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo",
  invocationTarget: "https://example.com/foo",
  controller: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
  expires: "2021-11-03T18:33:51Z",
  allowedAction: ["read"],
  proof: {
    type: "Ed25519Signature2020",
    created: "2021-10-27T18:33:51Z",
    verificationMethod: "did:key:z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9#z6MkfWKcvBiKCfNgz5UUGseNt37t4dguEvFgJ9XvX2UV6zB9",
    proofPurpose: "capabilityDelegation", // fixed
    capabilityChain: ["urn:zcap:root:https%3A%2F%2Fexample.com%2Ffoo"],
    proofValue: "z3t9BCQyF21MDVYmLKc9zbLreqx4wBtQnUsd5aqyoWS5FfhapRz7QjPNLcgKAornUVmJR4ZjbGpuxRFnffxX1ZjtF",
  },
}

const result = DelegatedZcap.safeParse(delegatedZcap)
console.log(result.success) // true
console.log(result.data.proof.proofPurpose) // "capabilityDelegation"`,
        expose: ["result"],
        check: ({ result }) => ({
          ok: result.success === true && result.data.proof.proofPurpose === "capabilityDelegation",
          output: result.success ? result.data : result.error.issues,
        }),
      },
      {
        // Needs the network: fetches the spec and the extractor from other origins.
        // Some spec examples are known not to conform (see
        // test/zcap-spec-examples-schema.test.ts), so this passes when every
        // example was checked and at least one validated; the output lists each.
        name: "Check every example in the zcap-spec",
        code: `import * as zcapZod from "${MODULE_URL}"
import { extractExamples, parseExampleContent } from "https://gobengo.github.io/zcap-spec-examples/lib/examples.js"

const schemas = ["RootZcap", "DelegatedZcap", "ZcapInvocation"]
const response = await fetch("https://w3c-ccg.github.io/zcap-spec/v0.4.0-draft/")
const results = []
for await (const example of extractExamples(response)) {
  let value
  try {
    value = parseExampleContent(example)
  } catch {
    results.push({ name: example.name, mediaType: example.mediaType, skipped: "not JSON" })
    continue
  }
  const result = zcapZod.Zcap.safeParse(value)
  results.push({
    name: example.name,
    mediaType: example.mediaType,
    value,
    valid: result.success,
    schema: schemas.find((schema) => zcapZod[schema].safeParse(value).success),
    issues: result.success ? undefined : result.error.issues,
  })
}
console.table(results)`,
        expose: ["results"],
        check: ({ results }) => ({
          ok: results.length > 0 && results.some((result) => result.valid),
          output: results,
        }),
      },
    ]

    const container = document.getElementById("tests")
    const results = []

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props)
      node.append(...children)
      return node
    }

    for (const test of tests) {
      const html = `<script type="module">\n${test.code}\n<\/script>`
      const heading = el("h2", {}, `⏳ ${test.name}`)
      const copy = el("button", { className: "copy", type: "button" }, "Copy")
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(html)
          copy.textContent = "Copied"
        } catch {
          copy.textContent = "Copy failed"
        }
        setTimeout(() => (copy.textContent = "Copy"), 1500)
      })
      const output = el("pre", { className: "output" }, "…")
      container.append(
        el("section", {},
          heading,
          ...(test.description ? [el("p", { className: "description" }, test.description)] : []),
          el("div", { className: "snippet" }, el("pre", {}, el("code", {}, html)), copy),
          el("p", { className: "label" }, "Result"),
          output,
        ),
      )

      let ok = false
      try {
        const source = `${test.code}\nexport { ${test.expose.join(", ")} }\n`
        const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }))
        try {
          const outcome = test.check(await import(url))
          ok = outcome.ok
          output.textContent = JSON.stringify(outcome.output, null, 2)
        } finally {
          URL.revokeObjectURL(url)
        }
      } catch (error) {
        output.textContent = String(error?.stack ?? error)
      }
      heading.textContent = `${ok ? "✅" : "❌"} ${test.name}`
      results.push(ok)
    }

    const pass = results.every(Boolean)
    document.body.dataset.status = pass ? "pass" : "fail"
    document.getElementById("badge").textContent = pass ? "✅" : "❌"
    document.getElementById("summary").textContent = pass
      ? "zcap-zod works in this browser"
      : "zcap-zod smoke test failed"
    document.title = `${pass ? "✅" : "❌"} zcap-zod smoke test`

    try {
      const info = await (await fetch("./build-info.json")).json()
      const build = document.getElementById("build")
      const commit = el(info.commitUrl ? "a" : "code", {}, info.commit.slice(0, 12))
      if (info.commitUrl) commit.href = info.commitUrl
      build.replaceChildren("Built from commit ", commit, ` at ${info.builtAt}`)
    } catch {}
  </script>
</body>
</html>
